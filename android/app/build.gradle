plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.budgett.budgett_frontend"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.budgett.budgett_frontend"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // MediaPipe and ML Kit both need keep rules; see proguard-rules.pro.
            // Without them R8 fails the release build on protobuf annotations
            // that are referenced but never loaded.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    // ContextCompat / NotificationManagerCompat, used by the message-capture
    // notification listener, SMS receiver and location snapshot.
    implementation("androidx.core:core-ktx:1.13.1")

    // On-device OCR for photographed receipts. The Latin model ships inside
    // the APK rather than being fetched from Play Services, so the first
    // receipt works offline and on a phone with no Play Store.
    implementation("com.google.mlkit:text-recognition:16.0.1")

    // MediaPipe's LLM runtime, for the optional local model that reads what
    // the rules cannot. The model weights are NOT bundled — they are several
    // gigabytes and this APK is distributed over the air — so this is only
    // the runtime, and it stays dormant until the user downloads a model.
    implementation("com.google.mediapipe:tasks-genai:0.10.24")
}
